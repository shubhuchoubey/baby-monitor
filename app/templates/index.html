<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            font-family: -apple-system, system-ui, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: #101318;
            color: #e8eaed;
        }
        h1 { margin: 0; font-size: 1.6rem; }
        .status { color: #7ee787; font-size: 0.95rem; }
        .hint { color: #8b949e; font-size: 0.8rem; }
        .feed {
            max-width: 100%;
            width: min(90vw, 960px);
            border-radius: 8px;
            background: #000;
            aspect-ratio: 16 / 9;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <h1>{{ title }}</h1>
    <img class="feed" src="/video_feed" alt="Live camera feed"
         onerror="this.insertAdjacentHTML('afterend', '<p class=hint>Camera unavailable.</p>'); this.remove();" />
    <p class="status">Server is running.</p>
</body>
</html>
