<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            font-family: -apple-system, system-ui, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: #101318;
            color: #e8eaed;
        }
        h1 { margin: 0; font-size: 1.6rem; }
        .status { color: #7ee787; font-size: 0.95rem; }
        .hint { color: #8b949e; font-size: 0.8rem; }
    </style>
</head>
<body>
    <h1>{{ title }}</h1>
    <p class="status">Server is running.</p>
    <p class="hint">Video and audio will appear here in a later step.</p>
</body>
</html>
